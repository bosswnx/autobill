<!doctype html>
<html lang="zh-CN" class="layout-phone">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const mode =
            localStorage.getItem('autobill.theme') ||
            localStorage.getItem('tagbill.theme') ||
            localStorage.getItem('tagledger.theme') ||
            'system'
          const dark =
            mode === 'dark' ||
            (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          const meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#191919' : '#F7F6F3')
        } catch {
          /* ignore */
        }
      })()
    </script>
    <script>
      (() => {
        const tauri = '__TAURI_INTERNALS__' in window
        const shortest = Math.min(screen.width, screen.height)
        const landscape = innerWidth > innerHeight
        const desktop = tauri || (shortest >= 600 && landscape)
        document.documentElement.classList.toggle('layout-desktop', desktop)
        document.documentElement.classList.toggle('layout-phone', !desktop)
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F6F3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>轻记账</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
