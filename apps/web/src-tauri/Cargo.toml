[package]
name = "autobill"
version = "0.0.0"
description = "轻记账"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "autobill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
