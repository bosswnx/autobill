services:
  autobill:
    build: .
    image: autobill:local
    container_name: autobill
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8787"
      HOST: 0.0.0.0
      AUTOBILL_DATA: /data
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/data
